name: Flutter CI

on:
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ci.yml'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.2'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Test
        run: flutter test
