apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: market-agent
  namespace: market-agent
spec:
  ingressClassName: traefik
  rules:
    - host: market-agent.test
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: market-agent-api
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: market-agent-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: market-agent-web
                port:
                  number: 80
