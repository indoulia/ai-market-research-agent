apiVersion: batch/v1
kind: Job
metadata:
  name: market-agent-migrate
  namespace: market-agent
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: market-agent-api:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: market-agent-secrets
                  key: DATABASE_URL
